# Testaufbau auf GitHub Pages.
#
# Zweck: eine echte, teilbare Adresse zum Anschauen und Durchklicken, ohne
# auf die Hosting- und Domain-Entscheidung zu warten. NICHT die spätere
# öffentliche Seite — die liegt bei IONOS unter eigener Domain.
#
# Zwei Dinge sind hier anders als auf der echten Seite:
#   - BASE_PATH: GitHub Pages liefert unter sveng0.github.io/MLetics/ aus,
#     also in einem Unterordner. Ohne das zeigen alle Links ins Leere.
#   - Die Seite setzt sich selbst auf "nicht indexieren" (siehe
#     src/pages/robots.txt.ts und Base.astro), damit später nicht zwei
#     identische Seiten um dieselben Suchbegriffe konkurrieren.
#
# Das Kontaktformular kann hier NICHT funktionieren: GitHub Pages liefert nur
# fertige Dateien aus und kann nichts entgegennehmen.

name: Testseite auf GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt das Auslösen von Hand über den Reiter "Actions".
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deploy noch, während schon der nächste Push kommt: den laufenden
# zu Ende bringen, aber nur den neuesten wartenden ausführen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Astro bauen und hochladen
        uses: withastro/action@v6
        env:
          SITE_URL: https://sveng0.github.io
          BASE_PATH: /MLetics

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
