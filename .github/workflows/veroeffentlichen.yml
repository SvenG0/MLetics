# Veröffentlichung auf mletics.de (netcup Webhosting).
#
# Läuft bei jedem Push auf main: baut die Seite und spiegelt den Ordner
# dist/ in das Web-Verzeichnis bei netcup. Danach ist die Änderung live.
#
# Unterschied zur Testseite auf GitHub Pages (testseite.yml): Dort werden
# SITE_URL und BASE_PATH gesetzt, weil sie in einem Unterordner liegt und
# nicht in die Suche geraten soll. Hier wird NICHTS gesetzt — die Vorgaben
# in astro.config.mjs (https://mletics.de, Wurzelverzeichnis) sind genau
# die richtigen für die echte Seite.
#
# VERSCHLÜSSELUNG: FTPS, nicht SFTP. Ein zusätzliches FTP-Konto in Plesk
# kann kein SFTP — das haengt am SSH-Zugang des Systembenutzers. Mit
# ssl-force und ssl-protect-data sind Steuer- UND Datenkanal verschluesselt;
# ohne TLS bricht lftp ab, statt still im Klartext zu uebertragen.
# ssl:verify-certificate prueft zusaetzlich das Serverzertifikat.
#
# ZUGANGSDATEN liegen als "Secrets" im Repository und sind für niemanden
# lesbar, auch nicht für mich. Anzulegen unter:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     NETCUP_HOST      z. B. abc.kasserver.de oder die IP des Webhostings
#     NETCUP_BENUTZER  der SFTP-Benutzer aus Plesk
#     NETCUP_PASSWORT  dessen Passwort
#     NETCUP_PFAD      Zielverzeichnis, bei Plesk üblicherweise /httpdocs

name: Veröffentlichen auf mletics.de

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modus:
        description: 'Was soll unter mletics.de stehen?'
        type: choice
        required: true
        default: baustelle
        options:
          - baustelle
          - echte-seite

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Seite bauen
        run: npx astro build

      # WARTUNGSMODUS. Laesst von der gebauten Seite nur die
      # Baustellenseite uebrig — samt dem Wenigen, worauf sie verweist.
      # Die fertigen Seiten und die Galeriebilder kommen damit gar nicht
      # erst auf den Server; "nicht vorhanden" ist staerker als
      # "umgeleitet". Das Werkzeug legt zugleich die .htaccess an, die
      # alles mit Status 503 beantwortet.
      #
      # Bei einem gewoehnlichen Push greift der Modus ebenfalls, solange
      # die Variable WARTUNG auf 'an' steht — sonst wuerde die naechste
      # Textaenderung die Seite versehentlich wieder freischalten.
      - name: Nur die Baustelle veröffentlichen
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.modus == 'baustelle')
          || (github.event_name != 'workflow_dispatch' && vars.WARTUNG == 'an')
        run: |
          node werkzeuge/nur-baustelle.mjs
          echo "── Was hochgeladen wird ──"
          find dist -type f | sort

      # Bewusst kein fertiger Upload-Baustein aus dem Marktplatz: Ein solcher
      # bekäme das Passwort in die Hand, und was er damit tut, steht in
      # fremdem Code. lftp ist ein Standardwerkzeug, der Befehl steht hier
      # vollständig und ist nachlesbar.
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Ziel prüfen
        env:
          HOST: ${{ secrets.NETCUP_HOST }}
          BENUTZER: ${{ secrets.NETCUP_BENUTZER }}
          PASSWORT: ${{ secrets.NETCUP_PASSWORT }}
          PFAD: ${{ secrets.NETCUP_PFAD }}
        run: |
          # Sicherung vor dem Loeschen: Der naechste Schritt raeumt im
          # Zielverzeichnis auf. Landet er im falschen, waere der Schaden
          # gross.
          #
          # Erster Versuch prüfte, ob der Pfad auf "httpdocs" endet — das
          # war falsch gedacht. Das FTP-Konto hat /mletics.de/httpdocs als
          # Basisverzeichnis und sieht genau das als sein "/". Es KANN also
          # nie auf httpdocs enden. Die Sicherung verhinderte damit genau
          # den Fall, den sie absichern sollte.
          #
          # Jetzt wird die echte Gefahr geprüft: dass wir eine oder zwei
          # Ebenen zu hoch stehen. Dort laegen Verzeichnisse namens
          # "mletics.de" bzw. "httpdocs" — im richtigen Ziel gibt es die
          # nicht. Tauchen sie auf, wird abgebrochen.
          inhalt=$(lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -u '$BENUTZER','$PASSWORT' ftp://$HOST;
            cd '$PFAD';
            pwd;
            cls -1;
          ")
          echo "── Das Konto landet hier: ──"
          echo "$inhalt"
          echo "────────────────────────────"
          if echo "$inhalt" | grep -qxE 'mletics\.de/?|httpdocs/?'; then
            echo "ABBRUCH: Im Ziel liegt ein Verzeichnis 'mletics.de' oder"
            echo "'httpdocs'. Das Konto steht damit zu hoch — es soll IM"
            echo "httpdocs landen, nicht darueber. Basisverzeichnis des"
            echo "FTP-Kontos in Plesk pruefen."
            exit 1
          fi
          echo "Ziel sieht richtig aus."

      - name: Dateien hochladen (vor dem HTML)
        env:
          HOST: ${{ secrets.NETCUP_HOST }}
          BENUTZER: ${{ secrets.NETCUP_BENUTZER }}
          PASSWORT: ${{ secrets.NETCUP_PASSWORT }}
          PFAD: ${{ secrets.NETCUP_PFAD }}
        run: |
          # Erst CSS, JS, Schriften und Bilder — ohne zu loeschen. Danach
          # erst das HTML, das darauf verweist. Andersherum koennte ein
          # Besucher waehrend der Uebertragung neues HTML erhalten, dessen
          # Dateien noch nicht oben sind: die Seite erschiene ohne
          # Gestaltung. Das Fenster dafuer ist jetzt nur noch so lang wie
          # das Hochladen von drei HTML-Dateien.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 3;
            open -u '$BENUTZER','$PASSWORT' ftp://$HOST;
            mirror --reverse --parallel=4 \
                   --exclude-glob *.html \
                   dist/ '$PFAD';
          "

      - name: HTML hochladen und aufräumen
        env:
          HOST: ${{ secrets.NETCUP_HOST }}
          BENUTZER: ${{ secrets.NETCUP_BENUTZER }}
          PASSWORT: ${{ secrets.NETCUP_PASSWORT }}
          PFAD: ${{ secrets.NETCUP_PFAD }}
        run: |
          # --delete raeumt alte Dateien weg. Astro haengt an jede CSS- und
          # Bilddatei einen Pruefcode im Namen; ohne das Aufraeumen blieben
          # alle frueheren Fassungen fuer immer liegen (rund 25 MB je Build).
          #
          # .well-known ist ausgenommen: Dort legt Let's Encrypt die Dateien
          # ab, mit denen es alle 90 Tage prueft, ob die Domain noch euch
          # gehoert. Mitgeloescht hiesse: Zertifikat laeuft ab, Browser
          # zeigen eine Sicherheitswarnung.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 3;
            open -u '$BENUTZER','$PASSWORT' ftp://$HOST;
            mirror --reverse --delete --parallel=4 --verbose \
                   --exclude-glob .well-known/ \
                   dist/ '$PFAD';
          "

      - name: Erreichbarkeit prüfen
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://mletics.de/ || true)
          echo "mletics.de antwortet mit $code"
          # 200 = echte Seite, 503 = Wartungsmodus. Beides ist richtig;
          # alles andere ist ein Fehler.
          case "$code" in
            200|503) echo "In Ordnung." ;;
            *) echo "Unerwartet."; exit 1 ;;
          esac
